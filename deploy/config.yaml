# 灯具已接入 v7 / 320；当前保留离线验收状态，实时启用由 enabled 控制。
version: 1
runtime:
  host: 0.0.0.0
  port: 8000
  jpeg_quality: 80
  log_level: warning
  memory_budget_mb_per_camera: 500
  output_dir: data
  persist_images: false
  retention_hours: 48
schedule:
  timezone: Asia/Shanghai
  day_start: 07:00
  day_end: '17:00'
  night_start: '20:00'
  night_end: 03:00
  report_at: 07:00
callback:
  enabled: true
  url: http://192.168.1.24:6034/protal/ai-alarm/webhook
  timeout_s: 10
  retries: 2
  queue_size: 64
  image_field: frame_base64
cameras:
- id: '1749'
  name: Mobile Camera 1749
  rtsp_url: rtsp://118.140.234.166:8554/dahua1002490
  enabled: true
  algorithms:
    water_gap:
      enabled: true
      backend: yolo
      schedule: day
      status: ready
      report_interval_s: 3600
    night_lamp:
      enabled: false
      schedule: night
      status: calibration_pending
      detector:
        weights: ../models/lamp_v7/best.pt
        device: cpu
        confidence: 0.35
        imgsz: 320
        detect_interval_s: 0.16
        visibility: background
      observation:
        cadence_s: 1800.0
        effective_s: 300.0
        deadline_s: 1500.0
        normal_pulses: 15
        failure_span_s: 10800.0
        failure_windows: 6
