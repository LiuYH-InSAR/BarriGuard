# Local/server trial configuration: callback disabled; algorithm settings unchanged.
version: 1
runtime:
  host: 0.0.0.0
  port: 8000
  jpeg_quality: 80
  log_level: warning
  memory_budget_mb_per_camera: 500
  output_dir: data
  persist_images: false
  retention_hours: 48
schedule:
  timezone: Asia/Shanghai
  day_start: 07:00
  day_end: '17:00'
  night_start: '20:00'
  night_end: 03:00
  report_at: 07:00
callback:
  enabled: false
  url: http://192.168.1.24:6034/protal/ai-alarm/webhook
  timeout_s: 10
  retries: 2
  queue_size: 64
  image_field: frame_base64
cameras:
- id: '1749'
  name: Mobile Camera 1749
  rtsp_url: rtsp://118.140.234.166:8554/dahua1002490
  enabled: true
  algorithms:
    water_gap:
      enabled: true
      backend: yolo
      schedule: day
      status: ready
      report_interval_s: 3600
    night_lamp:
      lamp_checks:
        enabled: true
        polygons: roi_configs/lamps/1749.json
        heatmap_ratio: 0.05
        hotspot_strength_min: 0.1
        lit_hours: 1
      enabled: true
      schedule: night
      status: ready
      night_gate:
        enter_threshold: 100.0
        exit_threshold: 120.0
        persistence: 2
      lamp_roi:
        calibration: roi_configs/1749.yaml
        dilate_px: 30
        up_px: 40
      sampling:
        interval_ms: 160
      memory:
        max_candidates: 200
        series_cap: null
      baseline:
        frames: 60
        warmup_s: 600
        ema_half_life_s: 1800
      periodicity:
        enabled: false
        period_step: 2
        lag_lo_s: 0.3
        lag_hi_s: 7.0
        peak_floor: 0.2
        min_peaks: 3
        gap_tol: 1
        onset_min: 20
      pulse:
        amplitude_min: 20.0
        rise_max_s: 0.48
        width_max_s: 1.2
        return_ratio: 0.25
        min_duration_s: 20.0
        max_gap_s: 4.0
      alignment:
        min_cc: 0.5
        on_low_cc: degraded
      overnight:
        enabled: true
        cadence_minutes: 60
        burst_seconds: 300
        anchor: wall
        record_local: true
        record_root: /app/data/night_offline
        video_days: 3
        result_days: 7
