# Run from deploy/, or use -f deploy/docker-compose.yml from the repository root.
# Keep the existing project/service/container identity for in-place server updates.
name: barri-guard
services:
  barriguard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: barriguard:yolo-v6
    container_name: barriguard
    environment:
      TZ: Asia/Shanghai
      BARRIGUARD_CONFIG: /app/deploy/config.yaml
    ports:
      - "${BARRIGUARD_HTTP_PORT:-8000}:8000"
    volumes:
      - ${BARRIGUARD_CONFIG_FILE:-./config.yaml}:/app/deploy/config.yaml:ro
      - ../data:/app/data
      - ../output/water_yolo:/app/output/water_yolo
      - ../output/model_settings:/app/output/model_settings
    cpus: "${BARRIGUARD_CPUS:-2}"
    mem_limit: ${BARRIGUARD_MEMORY:-4g}
    restart: unless-stopped
